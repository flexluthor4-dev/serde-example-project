[package]
name = "serde-example-project"
version = "0.1.0"
edition = "2021"

# This tells Rust what libraries (dependencies) we need
[dependencies]
# Serde is the main serialization framework
serde = { version = "1.0", features = ["derive"] }
# serde_json lets us work with JSON files
serde_json = "1.0"
# toml lets us work with TOML configuration files
toml = "0.8"
# serde_yaml lets us work with YAML files
serde_yaml = "0.9"
